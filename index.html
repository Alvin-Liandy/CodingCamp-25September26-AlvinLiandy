<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <div class="app-container">

    <!-- Header / Balance -->
    <header class="header">
      <h1 class="app-title">Budget Tracker</h1>
      <div class="balance-card">
        <span class="balance-label">Total Balance</span>
        <span class="balance-amount" id="totalBalance">Rp 0</span>
      </div>
    </header>

    <main class="main-content">

      <!-- Input Form -->
      <section class="card" id="formSection">
        <h2 class="section-title">Add Transaction</h2>
        <form id="transactionForm" novalidate>

          <div class="form-group">
            <label for="itemName">Item Name</label>
            <input
              type="text"
              id="itemName"
              placeholder="e.g. Lunch, Taxi, Netflix"
              autocomplete="off"
            />
            <span class="error-msg" id="itemNameError">Item name is required.</span>
          </div>

          <div class="form-group">
            <label for="amount">Amount (Rp)</label>
            <input
              type="number"
              id="amount"
              placeholder="e.g. 50000"
              min="1"
            />
            <span class="error-msg" id="amountError">Please enter a valid amount.</span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="">-- Select category --</option>
              <option value="Food">🍔 Food</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Fun">🎉 Fun</option>
            </select>
            <span class="error-msg" id="categoryError">Please select a category.</span>
          </div>

          <button type="submit" class="btn-primary">Add Transaction</button>
        </form>
      </section>

      <!-- Spending Chart -->
      <section class="card" id="chartSection">
        <h2 class="section-title">Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="spendingChart"></canvas>
          <p class="chart-empty" id="chartEmpty">No transactions yet.</p>
        </div>
      </section>

      <!-- Transaction List -->
      <section class="card" id="listSection">
        <h2 class="section-title">Transactions</h2>
        <ul class="transaction-list" id="transactionList">
          <!-- Items injected by JS -->
        </ul>
        <p class="list-empty" id="listEmpty">No transactions yet. Add one above!</p>
      </section>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
